apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/milan-bud/k8s-test.git'
    path: charts/minio
    targetRevision: main
    helm:
      valueFiles:
        - '../../environments/test/minio-values.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
