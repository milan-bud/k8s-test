apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-ngx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/milan-bud/YOUR_REPO.git 
    targetRevision: main
    path: charts/paperless-ngx
    helm:
      valueFiles:
        - '../../environments/test/paperless-ngx-values.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless-ngx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
