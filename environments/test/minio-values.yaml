minio:
  defaultBuckets: "loki-data,prometheus-data"
  rootUser: "admin"
  rootPassword: "admin"

  persistence:
    enabled: true
    storageClass: "standard"
    size: 5Gi

  primary:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
