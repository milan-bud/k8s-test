kube-prometheus-stack:
  crds:
    enabled: false
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 1d
      enableRemoteWriteReceiver: true
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
  grafana:
    crds:
      create: false
    adminPassword: "admin12345"
    resources:
      requests:
        memory: "128Mi"

loki:
  loki-canary:
    enabled: false
  promtail:
    enabled: false
  logs:
    enabled: false
  crds:
    enabled: false
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    s3:
      endpoint: http://minio.observability.svc.cluster.local:9000
      bucketnames: loki-data
      accessKeyId: admin
      secretAccessKey: admin12345
      s3ForcePathStyle: true
      insecure: true

alloy:
  enabled: true
  controller:
    type: daemonset
  rbac:
    create: true
  serviceAccount:
    create: true
  alloy:
    mounts:
      varlog: true
      dockercontainers: true
    configMap:
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        prometheus.remote_write "default" {
          endpoint {
            url = "http://observability-stack-kube-p-prometheus.observability.svc.cluster.local:9090/api/v1/write"
          }
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        prometheus.scrape "pod_metrics" {
          targets    = discovery.kubernetes.pods.targets
          forward_to = [prometheus.remote_write.default.receiver]
        }

        discovery.kubernetes "pod_logs" {
          role = "pod"
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.kubernetes.pod_logs.targets
          forward_to = [loki.process.add_labels.receiver]
        }

        loki.process "add_labels" {
          stage.cri {}
          forward_to = [loki.write.local_loki.receiver]
        }

        loki.write "local_loki" {
          endpoint {
            url = "http://observability-stack-loki.observability.svc.cluster.local:3100/loki/api/v1/push"
            headers = {
              "X-Scope-OrgID" = "anonymous"
            }
          }
        }
