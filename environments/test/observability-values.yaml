kube-prometheus-stack:
  crds:
    enabled: false
  prometheus:
    prometheusSpec:
      retention: 1d
      enableRemoteWriteReceiver: true
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
  grafana:
    adminPassword: "admin12345"
    resources:
      requests:
        memory: "128Mi"

loki:
  crds:
    enabled: false
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    s3:
      endpoint: http://minio.storage.svc.cluster.local:9000
      bucketnames: loki-data
      accessKeyId: admin
      secretAccessKey: admin12345 
      s3ForcePathStyle: true
      insecure: true

alloy:
  crds:
    enabled: false
  alloy:
    resources:
      requests:
        memory: "128Mi"
    configMap:
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        prometheus.remote_write "default" {
          endpoint {
            url = "http://observability-stack-kube-prom-prometheus.observability.svc.cluster.local:9090/api/v1/write"
          }
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        prometheus.scrape "pod_metrics" {
          targets    = discovery.kubernetes.pods.targets
          forward_to = [prometheus.remote_write.default.receiver]
        }
