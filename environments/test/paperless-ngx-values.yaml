paperless-ngx:
  # Disable postgresql and use built-in SQLite for local testing
  postgresql:
    enabled: false

  # Enable the built-in redis dependency
  redis:
    enabled: true

  # Pass environment overrides directly to the container
  env:
    PAPERLESS_DBENGINE: "sqlite"
    PAPERLESS_REDIS: "redis://paperless-ngx-redis-master:6379"
    PAPERLESS_ADMIN_USER: "admin"
    PAPERLESS_ADMIN_PASSWORD: "Admin12345"
