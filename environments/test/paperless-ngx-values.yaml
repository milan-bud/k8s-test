paperless-ngx:
  # Enable built-in database & redis subcharts
  postgresql:
    enabled: true
  redis:
    enabled: true

  # Point paperless to the local namespace services if overridden
  env:
    PAPERLESS_REDIS: "redis://paperless-ngx-redis:6379"
    PAPERLESS_DBHOST: "paperless-ngx-postgresql"

  user:
    superuser:
      username: admin
      email: admin@local.domain
      password: Admin12345
